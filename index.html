<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnEspresso</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1A0F07;color:#FDF6EC;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  main{width:100%;max-width:420px;padding:32px 22px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:32px;font-weight:900;margin:0 0 8px}
  p{margin:0 0 22px;color:#C8B09A;font-size:15px;line-height:1.45}
  a{display:block;text-decoration:none;background:#FDF6EC;color:#1E0E04;border-radius:14px;padding:16px 16px 14px}
  strong{display:block;font-size:17px}
  span{display:block;margin-top:3px;color:#7A4E2D;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>AnEspresso</h1>
  <p>This address is the app directory, not a hospital board. Each hospital has its own page.</p>
  <a href="/corewell/royal-oak/">
    <strong>Corewell Royal Oak</strong>
    <span>Open this board</span>
  </a>
</main>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    rs.forEach(function (r) {
      try {
        if (new URL(r.scope).pathname === "/") r.unregister();
      } catch (e) {}
    });
  }).catch(function () {});
}
</script>
</body>
</html>
